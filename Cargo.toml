[workspace]
resolver = "3"
members = [
    "topper-core",
    # "topper-bt",
    "topper-aetolia",
    "topper-aetolia-mudlet",
    "topper-core-mudlet",
    # Cargo rejects globs that match nothing, so this one also matches topper-derive.
    # It picks up topper-duris* on the private mirror and is harmless on the public one.
    "topper-d[eu]*",
    "topper-explainer",
    "topper-persuasion",
    "topper-sect-watch/src-wasm",
    "topper-sect-watch/supabase/functions/share-log/share-log-wasm",
]
